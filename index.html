<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TimeYN2</title>

<!--
  ============================================
  วิธีใช้งาน
  ============================================
  1) แก้ชื่อเพจในส่วน .brand h1
  2) เพิ่ม/ลบ "การ์ดลิงก์" แต่ละอันได้ในส่วน .banner-list
     - copy บล็อก <a class="banner banner-icon">...</a> เพื่อเพิ่มลิงก์ใหม่
  3) รูปพื้นหลัง: images/bg1.jpg (พื้นหลังทั้งหน้า), images/bg2.jpg (พื้นหลังส่วนหัว)
  ============================================
-->

<style>
  :root{
    --card:#121a26;
    --card-border:rgba(91,157,255,0.25);
    --text:#eef3fb;
    --muted:#9fb3cc;
    --accent:#2196f3;
    --accent2:#5865F2;
  }
  *{box-sizing:border-box; margin:0; padding:0;}

  html,body{
    min-height:100vh;
  }
  body{
    background:#060a12;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Sarabun",sans-serif;
    color:var(--text);
    display:flex;
    justify-content:center;
    overflow-x:hidden;
    position:relative;
  }

  /* ---- animated background layer (Ken Burns + drifting glow) ---- */
  .bg-layer{
    position:fixed;
    inset:0;
    z-index:0;
    overflow:hidden;
  }
  .bg-layer .bg-img{
    position:absolute;
    inset:-5%;
    width:110%;
    height:110%;
    background:url("images/bg2.jpg") center / cover no-repeat;
    filter:saturate(1.05) brightness(0.75);
    animation:kenburns 22s ease-in-out infinite alternate;
  }
  @keyframes kenburns{
    0%{ transform:scale(1) translate(0,0); }
    100%{ transform:scale(1.15) translate(-2%,-2%); }
  }
  .bg-layer::after{
    content:"";
    position:absolute;
    inset:0;
    background:
      radial-gradient(circle at 30% 20%, rgba(33,150,243,0.35), transparent 45%),
      radial-gradient(circle at 75% 80%, rgba(88,101,242,0.35), transparent 45%),
      linear-gradient(180deg, rgba(6,10,18,0.75), rgba(6,10,18,0.92));
    animation:glow-shift 14s ease-in-out infinite alternate;
  }
  @keyframes glow-shift{
    0%{ opacity:0.85; }
    50%{ opacity:1; }
    100%{ opacity:0.85; }
  }

  .page{
    position:relative;
    z-index:1;
    width:100%;
    max-width:480px;
    min-height:100vh;
    background:rgba(8,14,24,0.35);
    backdrop-filter:blur(1.5px);
    -webkit-backdrop-filter:blur(1.5px);
    box-shadow:0 0 80px rgba(0,0,0,0.6);
  }

  /* ---- logo / header title ---- */
  .brand{
    position:relative;
    text-align:center;
    padding:80px 20px 70px;
    overflow:hidden;
    border-bottom:1px solid var(--card-border);
  }
  .brand .brand-bg{
    position:absolute;
    inset:0;
    background:url("images/bg1.jpg") center 15% / cover no-repeat;
    filter:brightness(0.55) saturate(1.1);
    transform:scale(1.05);
    animation:brand-pan 18s ease-in-out infinite alternate;
    z-index:0;
  }
  @keyframes brand-pan{
    0%{ transform:scale(1.05) translateX(0); }
    100%{ transform:scale(1.12) translateX(-2%); }
  }
  .brand::after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(180deg, rgba(6,10,18,0.35), rgba(6,10,18,0.85));
    z-index:0;
  }
  .brand h1, .brand p{
    position:relative;
    z-index:1;
  }
  .brand h1{
    font-size:34px;
    font-weight:800;
    letter-spacing:1px;
    color:#ffffff;
    text-shadow:0 2px 20px rgba(33,150,243,0.6);
  }
  .brand p{
    color:var(--muted);
    font-size:12px;
    margin-top:8px;
    letter-spacing:3px;
    text-transform:uppercase;
  }

  /* ---- banner list ---- */
  .banner-list{
    position:relative;
    z-index:1;
    display:flex;
    flex-direction:column;
    gap:16px;
    padding:28px 16px 40px;
  }
  .banner{
    display:block;
    position:relative;
    border-radius:14px;
    overflow:hidden;
    text-decoration:none;
    transition:transform .15s ease, box-shadow .2s ease, border-color .2s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .banner:hover{
    transform:scale(1.015);
    box-shadow:0 8px 28px rgba(33,150,243,0.35);
  }
  .banner:active{
    transform:scale(0.97);
  }
  .banner .ripple{
    position:absolute;
    border-radius:50%;
    background:rgba(120,180,255,0.35);
    transform:scale(0);
    animation:ripple-anim .55s ease-out forwards;
    pointer-events:none;
  }
  @keyframes ripple-anim{
    to{
      transform:scale(3.5);
      opacity:0;
    }
  }

  /* ---- icon-style banner (for Discord / Donate etc.) ---- */
  .banner-icon{
    display:flex;
    align-items:center;
    gap:16px;
    padding:18px 20px;
    background:linear-gradient(135deg, rgba(18,26,38,0.9), rgba(10,16,26,0.9));
    border:1px solid var(--card-border);
    backdrop-filter:blur(6px);
  }
  .banner-icon .icon-circle{
    flex:none;
    width:52px;
    height:52px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    transition:transform .2s ease;
    box-shadow:0 0 18px rgba(33,150,243,0.5);
  }
  .banner:hover .icon-circle{
    transform:rotate(-6deg) scale(1.08);
  }
  .banner-icon .icon-circle svg{
    width:26px;
    height:26px;
  }
  .banner-icon .icon-text{
    flex:1;
  }
  .banner-icon .icon-text .title{
    font-size:16px;
    font-weight:700;
    color:var(--text);
  }
  .banner-icon .icon-text .sub{
    font-size:12px;
    color:var(--muted);
    margin-top:2px;
  }
  .banner-icon .chevron{
    flex:none;
    color:#4d6280;
    font-size:20px;
  }
</style>
</head>
<body>

<div class="bg-layer">
  <div class="bg-img"></div>
</div>

<div class="page">

  <div class="brand">
    <div class="brand-bg"></div>
    <h1>TimeYN2</h1>
    <p>Thank You</p>
  </div>

  <div class="banner-list">

    <!-- แบนเนอร์ที่ 1: Discord -->
    <a class="banner banner-icon" href="https://discord.gg/FY37ZD2Mz" target="_blank" rel="noopener">
      <span class="icon-circle" style="background:#5865F2;">
        <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
          <path d="M20.317 4.369a19.79 19.79 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.211.375-.444.864-.608 1.249a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.249.077.077 0 0 0-.079-.037 19.736 19.736 0 0 0-4.885 1.515.07.07 0 0 0-.032.027C.533 9.045-.319 13.579.099 18.057a.082.082 0 0 0 .031.056 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128c.126-.094.252-.192.372-.291a.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.01c.12.099.246.198.373.291a.077.077 0 0 1-.006.128 12.3 12.3 0 0 1-1.873.892.076.076 0 0 0-.04.106c.36.699.772 1.364 1.225 1.994a.077.077 0 0 0 .084.028 19.84 19.84 0 0 0 6.002-3.03.077.077 0 0 0 .032-.055c.5-5.177-.838-9.674-3.548-13.66a.061.061 0 0 0-.031-.028zM8.02 15.331c-1.183 0-2.157-1.086-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.211 0 2.176 1.096 2.157 2.42 0 1.332-.955 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.086-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.211 0 2.176 1.096 2.157 2.42 0 1.332-.946 2.418-2.157 2.418z"/>
        </svg>
      </span>
      <span class="icon-text">
        <span class="title">เข้าร่วม Discord</span>
        <span class="sub">discord.gg/FY37ZD2Mz</span>
      </span>
      <span class="chevron">›</span>
    </a>

    <!-- แบนเนอร์ที่ 2: โดเนท -->
    <a class="banner banner-icon" href="https://ezdn.app/timeyn2" target="_blank" rel="noopener">
      <span class="icon-circle" style="background:#2196f3;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
          <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
        </svg>
      </span>
      <span class="icon-text">
        <span class="title">สนับสนุน / โดเนท</span>
        <span class="sub">ezdn.app/timeyn2</span>
      </span>
      <span class="chevron">›</span>
    </a>

    <!-- copy บล็อกด้านบนเพื่อเพิ่มลิงก์อื่นๆ ต่อได้เรื่อยๆ -->

  </div>

</div>

<script>
  document.querySelectorAll('.banner').forEach(function(el){
    el.addEventListener('click', function(e){
      const rect = el.getBoundingClientRect();
      const size = Math.max(rect.width, rect.height);
      const ripple = document.createElement('span');
      ripple.className = 'ripple';
      ripple.style.width = ripple.style.height = size + 'px';
      ripple.style.left = (e.clientX - rect.left - size / 2) + 'px';
      ripple.style.top = (e.clientY - rect.top - size / 2) + 'px';
      el.appendChild(ripple);
      setTimeout(function(){ ripple.remove(); }, 550);
    });
  });
</script>

</body>
</html>
