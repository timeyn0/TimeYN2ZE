<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0A1230">
<title>TimeYN2</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600&family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">

<!--
  ============================================
  วิธีใช้งาน
  ============================================
  1) แก้ชื่อเพจที่ <h1 class="name"> และข้อความใต้หน้าปัดที่ <p class="thanks">
  2) เพิ่ม/ลบลิงก์ในส่วน <nav class="links">
     - copy บล็อก <a class="link">...</a> แล้วแก้ href / ชื่อ / ไอคอน
     - เปลี่ยนสีไอคอนของแต่ละการ์ดได้ที่ style="--c:#สี"
     - ใส่ class "featured" เพิ่ม ถ้าอยากให้การ์ดนั้นเด่นกว่าอันอื่น (เหมือนการ์ดโดเนท)
  3) รูปพื้นหลัง: images/bg1.jpg (ส่วนหัว), images/bg2.jpg (พื้นหลังทั้งหน้า)
     - ถ้าไม่มีรูป หน้าเว็บจะใช้พื้นหลังไล่สีแทนอัตโนมัติ
  4) สีหลักทั้งหมดแก้ได้ใน :root ด้านล่าง
  ============================================
-->

<style>
  :root{
    --night:#0A1230;                    /* พื้นหลังหลัก */
    --panel:rgba(19,32,73,.72);         /* พื้นการ์ด */
    --line:rgba(140,170,255,.18);       /* เส้นขอบ */
    --text:#EAF1FF;
    --muted:#93A6CC;
    --signal:#5CE1FF;                   /* สีเข็มวินาทีรอบหน้าปัด */
    --amber:#FFB547;                    /* สีการ์ดเด่น (โดเนท) */
    --display:"Chakra Petch","Segoe UI",sans-serif;
    --body:"Anuphan","Sarabun",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}

  html{background:var(--night);}
  body{
    min-height:100vh;
    min-height:100dvh;
    background:var(--night);
    color:var(--text);
    font-family:var(--body);
    display:flex;
    justify-content:center;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }

  /* ---- พื้นหลังทั้งหน้า (bg2) ---- */
  .bg{
    position:fixed;
    inset:-20px;
    z-index:0;
    background:
      linear-gradient(180deg, rgba(10,18,48,.62), rgba(10,18,48,.94)),
      url("images/bg2.jpg") center / cover no-repeat,
      radial-gradient(120% 70% at 50% 0%, #1F3478 0%, var(--night) 65%);
    filter:blur(3px) saturate(1.1);
  }

  .page{
    position:relative;
    z-index:1;
    width:100%;
    max-width:460px;
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    background:rgba(10,18,48,.45);
    border-inline:1px solid var(--line);
  }

  /* ---- ส่วนหัว ---- */
  .hero{
    position:relative;
    isolation:isolate;
    padding:44px 20px 28px;
    text-align:center;
  }
  .hero-bg{
    position:absolute;
    inset:0;
    z-index:-1;
    background:
      linear-gradient(180deg, rgba(10,18,48,.30), rgba(10,18,48,.55)),
      url("images/bg1.jpg") center 15% / cover no-repeat,
      linear-gradient(160deg, #2A3F8F 0%, #142155 45%, var(--night) 100%);
    -webkit-mask-image:linear-gradient(180deg, #000 55%, transparent 100%);
            mask-image:linear-gradient(180deg, #000 55%, transparent 100%);
  }

  /* ---- หน้าปัดนาฬิกา ---- */
  .dial{
    position:relative;
    width:min(232px, 64vw);
    aspect-ratio:1;
    margin:0 auto;
  }
  .dial-face{
    position:absolute;
    inset:10%;
    border-radius:50%;
    background:radial-gradient(circle at 50% 30%, rgba(34,54,118,.78), rgba(10,18,48,.88) 70%);
    -webkit-backdrop-filter:blur(6px);
            backdrop-filter:blur(6px);
    box-shadow:
      inset 0 0 0 1px var(--line),
      inset 0 -12px 30px rgba(0,0,0,.35),
      0 18px 50px rgba(0,0,0,.45);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:8px;
  }
  .ticks{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    overflow:visible;
  }
  .ticks .rim{
    fill:none;
    stroke:var(--line);
    stroke-width:1;
  }
  .ticks line{
    stroke:rgba(200,215,255,.42);
    stroke-width:1.1;
    stroke-linecap:round;
    animation:tick-in .35s ease-out both;
    animation-delay:calc(var(--i) * 11ms);
  }
  .ticks line.major{
    stroke:var(--text);
    stroke-width:2.4;
  }
  @keyframes tick-in{
    from{ opacity:0; }
    to{ opacity:1; }
  }

  /* เข็มวินาที: หมุนตามเวลาจริงของคนที่เปิดดู */
  .rotor{
    position:absolute;
    inset:0;
    animation:spin 60s linear infinite;
  }
  .rotor .arc{
    position:absolute;
    inset:0;
    border-radius:50%;
    background:conic-gradient(
      rgba(92,225,255,0) 0deg 240deg,
      rgba(92,225,255,.28) 330deg,
      rgba(92,225,255,.85) 359deg,
      rgba(92,225,255,0) 359.8deg
    );
    -webkit-mask:radial-gradient(circle closest-side, transparent 83%, #000 85%, #000 97%, transparent 99%);
            mask:radial-gradient(circle closest-side, transparent 83%, #000 85%, #000 97%, transparent 99%);
  }
  .rotor .tip{
    position:absolute;
    left:50%;
    top:4.5%;
    width:8px;
    height:8px;
    border-radius:50%;
    transform:translate(-50%,-50%);
    background:var(--signal);
    box-shadow:0 0 8px var(--signal), 0 0 22px rgba(92,225,255,.65);
  }
  @keyframes spin{
    to{ transform:rotate(360deg); }
  }

  .name{
    font-family:var(--display);
    font-weight:700;
    font-size:clamp(26px, 8.2vw, 34px);
    line-height:1;
    letter-spacing:.02em;
    color:#fff;
    text-shadow:0 2px 18px rgba(92,225,255,.35);
    animation:fade-in .6s ease-out .55s both;
  }
  .clock{
    font-family:var(--display);
    font-weight:500;
    font-size:15px;
    letter-spacing:.12em;
    color:var(--signal);
    font-variant-numeric:tabular-nums;
    animation:fade-in .6s ease-out .7s both;
  }
  .thanks{
    margin-top:18px;
    font-family:var(--display);
    font-weight:500;
    font-size:18px;
    color:var(--muted);
    animation:fade-in .6s ease-out .8s both;
  }
  @keyframes fade-in{
    from{ opacity:0; transform:translateY(6px); }
    to{ opacity:1; transform:none; }
  }

  /* ---- การ์ดลิงก์ ---- */
  .links{
    display:flex;
    flex-direction:column;
    gap:14px;
    padding:8px 16px 32px;
  }
  .link{
    --c:#2196f3;
    position:relative;
    display:flex;
    align-items:stretch;
    min-height:78px;
    border-radius:16px;
    overflow:hidden;
    text-decoration:none;
    color:var(--text);
    background:var(--panel);
    border:1px solid var(--line);
    -webkit-backdrop-filter:blur(8px);
            backdrop-filter:blur(8px);
    transition:transform .15s ease, border-color .2s ease;
    -webkit-tap-highlight-color:transparent;
    animation:rise .5s ease-out both;
  }
  .link:nth-child(1){ animation-delay:.9s; }
  .link:nth-child(2){ animation-delay:1s; }
  .link:nth-child(3){ animation-delay:1.1s; }
  .link:nth-child(4){ animation-delay:1.2s; }
  .link:nth-child(n+5){ animation-delay:1.3s; }
  @keyframes rise{
    from{ opacity:0; transform:translateY(10px); }
    to{ opacity:1; transform:none; }
  }
  .link:hover{
    border-color:color-mix(in srgb, var(--c) 65%, transparent);
  }
  .link:active{
    transform:scale(.98);
  }
  .link:focus-visible{
    outline:2px solid var(--signal);
    outline-offset:3px;
  }

  .link-icon{
    flex:none;
    width:74px;
    display:grid;
    place-items:center;
    background:var(--c);
    color:#fff;
  }
  .link-icon svg{
    width:28px;
    height:28px;
    transition:transform .2s ease;
  }
  .link:hover .link-icon svg{
    transform:scale(1.1);
  }
  .link-text{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
    justify-content:center;
    gap:3px;
    padding:14px 4px 14px 16px;
  }
  .link-title{
    font-weight:600;
    font-size:17px;
    line-height:1.3;
  }
  .link-sub{
    font-size:13px;
    color:var(--muted);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .link-go{
    flex:none;
    width:46px;
    display:grid;
    place-items:center;
    color:var(--muted);
  }
  .link-go svg{
    width:18px;
    height:18px;
    transition:transform .2s ease, color .2s ease;
  }
  .link:hover .link-go svg{
    transform:translate(2px,-2px);
    color:var(--text);
  }

  /* การ์ดเด่น (ใส่ class="featured") */
  .link.featured{
    --c:var(--amber);
    background:
      linear-gradient(100deg, rgba(255,181,71,.14), rgba(255,181,71,0) 60%),
      var(--panel);
    border-color:rgba(255,181,71,.45);
    box-shadow:0 10px 30px rgba(255,181,71,.10);
  }
  .link.featured .link-icon{
    color:#3A2300;
  }
  .link.featured .link-sub{
    color:#E6C08A;
  }

  /* เอฟเฟกต์วงกระเพื่อมตอนกด */
  .link .ripple{
    position:absolute;
    border-radius:50%;
    background:rgba(255,255,255,.22);
    transform:scale(0);
    animation:ripple-anim .55s ease-out forwards;
    pointer-events:none;
  }
  @keyframes ripple-anim{
    to{ transform:scale(3.5); opacity:0; }
  }

  footer{
    margin-top:auto;
    padding:0 16px 28px;
    text-align:center;
    font-size:12px;
    color:rgba(147,166,204,.65);
  }

  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{
      animation:none !important;
      transition:none !important;
    }
    .rotor{ display:none; }
  }
</style>
</head>
<body>

<div class="bg" aria-hidden="true"></div>

<main class="page">

  <header class="hero">
    <div class="hero-bg" aria-hidden="true"></div>

    <div class="dial">
      <svg class="ticks" id="ticks" viewBox="0 0 200 200" aria-hidden="true">
        <circle class="rim" cx="100" cy="100" r="99"></circle>
      </svg>
      <div class="rotor" id="rotor" aria-hidden="true">
        <div class="arc"></div>
        <div class="tip"></div>
      </div>
      <div class="dial-face">
        <h1 class="name">TimeYN2</h1>
        <time class="clock" id="clock" aria-label="เวลาตอนนี้">--:--</time>
      </div>
    </div>

    <p class="thanks">Thank You</p>
  </header>

  <nav class="links" aria-label="ลิงก์">

    <!-- การ์ดที่ 1: Discord -->
    <!-- หมายเหตุ: ลิงก์ที่กดจริง (DeqW2pCw3f) กับตัวหนังสือใต้ชื่อ (FY37ZD2Mz) ยังไม่ตรงกัน แก้ให้ตรงกันด้วยนะ -->
    <a class="link" href="https://discord.gg/DeqW2pCw3f" target="_blank" rel="noopener" style="--c:#5865F2;">
      <span class="link-icon">
        <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M20.317 4.369a19.79 19.79 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.211.375-.444.864-.608 1.249a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.249.077.077 0 0 0-.079-.037 19.736 19.736 0 0 0-4.885 1.515.07.07 0 0 0-.032.027C.533 9.045-.319 13.579.099 18.057a.082.082 0 0 0 .031.056 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128c.126-.094.252-.192.372-.291a.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.01c.12.099.246.198.373.291a.077.077 0 0 1-.006.128 12.3 12.3 0 0 1-1.873.892.076.076 0 0 0-.04.106c.36.699.772 1.364 1.225 1.994a.077.077 0 0 0 .084.028 19.84 19.84 0 0 0 6.002-3.03.077.077 0 0 0 .032-.055c.5-5.177-.838-9.674-3.548-13.66a.061.061 0 0 0-.031-.028zM8.02 15.331c-1.183 0-2.157-1.086-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.211 0 2.176 1.096 2.157 2.42 0 1.332-.955 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.086-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.211 0 2.176 1.096 2.157 2.42 0 1.332-.946 2.418-2.157 2.418z"/>
        </svg>
      </span>
      <span class="link-text">
        <span class="link-title">เข้าร่วม Discord</span>
        <span class="link-sub">discord.gg/FY37ZD2Mz</span>
      </span>
      <span class="link-go" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M8 7h9v9"/></svg>
      </span>
    </a>

    <!-- การ์ดที่ 2: โดเนท (featured = การ์ดเด่นสีส้มทอง) -->
    <a class="link featured" href="https://ezdn.app/timeyn2" target="_blank" rel="noopener">
      <span class="link-icon">
        <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
        </svg>
      </span>
      <span class="link-text">
        <span class="link-title">สนับสนุน / โดเนท</span>
        <span class="link-sub">ezdn.app/timeyn2</span>
      </span>
      <span class="link-go" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M8 7h9v9"/></svg>
      </span>
    </a>

    <!-- copy บล็อก <a class="link">...</a> ด้านบนเพื่อเพิ่มลิงก์อื่นๆ ต่อได้เรื่อยๆ -->

  </nav>

  <footer>© <span id="year"></span> TimeYN2</footer>

</main>

<script>
  // ขีดรอบหน้าปัด 60 ขีด (ทุก 5 ขีดเป็นขีดยาว)
  (function(){
    var svg = document.getElementById('ticks');
    var ns = 'http://www.w3.org/2000/svg';
    for (var i = 0; i < 60; i++){
      var a = i * 6 * Math.PI / 180;
      var major = i % 5 === 0;
      var r1 = major ? 86 : 91, r2 = 96;
      var line = document.createElementNS(ns, 'line');
      line.setAttribute('x1', (100 + r1 * Math.sin(a)).toFixed(2));
      line.setAttribute('y1', (100 - r1 * Math.cos(a)).toFixed(2));
      line.setAttribute('x2', (100 + r2 * Math.sin(a)).toFixed(2));
      line.setAttribute('y2', (100 - r2 * Math.cos(a)).toFixed(2));
      if (major) line.setAttribute('class', 'major');
      line.style.setProperty('--i', i);
      svg.appendChild(line);
    }
  })();

  // ให้เข็มวินาทีตรงกับเวลาจริง + นาฬิกาตรงกลาง
  (function(){
    var rotor = document.getElementById('rotor');
    var clock = document.getElementById('clock');
    var now = new Date();
    rotor.style.animationDelay = -(now.getSeconds() + now.getMilliseconds() / 1000) + 's';

    function pad(n){ return String(n).padStart(2, '0'); }
    function tick(){
      var d = new Date();
      clock.textContent = pad(d.getHours()) + ':' + pad(d.getMinutes());
      clock.setAttribute('datetime', d.toISOString());
    }
    tick();
    setInterval(tick, 1000);

    document.getElementById('year').textContent = now.getFullYear();
  })();

  // วงกระเพื่อมตอนกดการ์ด
  document.querySelectorAll('.link').forEach(function(el){
    el.addEventListener('click', function(e){
      var rect = el.getBoundingClientRect();
      var size = Math.max(rect.width, rect.height);
      var ripple = document.createElement('span');
      ripple.className = 'ripple';
      ripple.style.width = ripple.style.height = size + 'px';
      ripple.style.left = (e.clientX - rect.left - size / 2) + 'px';
      ripple.style.top = (e.clientY - rect.top - size / 2) + 'px';
      el.appendChild(ripple);
      setTimeout(function(){ ripple.remove(); }, 550);
    });
  });
</script>

</body>
</html>
